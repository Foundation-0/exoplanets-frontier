name: Convergent Transit Discovery & Gaia Blend Engine

on:
  workflow_dispatch:
  push:
    paths:
      - "despot.py"
      - "ttv_track.py"
      - "blend_gaia.py"
      - "converge_io.py"
      - "converge.py"
      - ".github/workflows/converge.yml"

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone upstream catalog
        run: |
          rm -rf _eumemic
          git clone --depth 1 https://github.com/eumemic/exoplanets _eumemic

      - name: Install uv and scientific stack
        uses: astral-sh/setup-uv@v5

      - name: Run unit self-tests and live convergent MAST/Gaia campaign
        run: |
          rm -rf .venv
          uv venv .venv
          uv pip install --python .venv/bin/python numpy scipy pandas matplotlib astropy astroquery
          .venv/bin/python -m unittest ledger.py
          .venv/bin/python converge.py
          ls -la results/ results/figures/
          test -n "$(ls -A results/figures/*.png)"

      - name: Commit empirical ledgers, plots, and SHA-256 certificates
        run: |
          rm -rf _eumemic .venv
          git config user.name "orda-aska"
          git config user.email "orda-aska@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "Capture Phase 2 convergent TTV, Gaia WCS blend, and de-spotted M-dwarf results [skip ci]"
          git pull --rebase origin main
          git push origin main
