name: Run Deep M-Dwarf Discovery Pass

on:
  push:
    branches: [main]
    paths:
      - "mdwarf_hunt.py"
      - ".github/workflows/mdwarf_hunt.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mdwarf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: eumemic/exoplanets
          path: _eumemic
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install astronomy dependencies
        run: |
          rm -rf .venv && uv venv .venv
          uv pip install --python .venv/bin/python numpy scipy pandas matplotlib astropy astroquery requests
      - name: Syntax check and run M-dwarf multi-sector hunt
        run: |
          .venv/bin/python -m py_compile mdwarf_hunt.py
          .venv/bin/python mdwarf_hunt.py
          if [ -f results/DISCOVERIES.md ]; then cat results/DISCOVERIES.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Commit updated results
        run: |
          rm -rf _eumemic .venv
          git config user.name "orda-aska"
          git config user.email "orda-aska@users.noreply.github.com"
          git add results/
          if ! git diff --cached --quiet; then
            git commit -m "Update discovery ledger with deep S106-S107 M-dwarf pass [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
